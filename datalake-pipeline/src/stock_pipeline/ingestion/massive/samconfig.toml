version = 0.1

# ============================================================
# Massive Exchanges Ingestion Lambda — SAM Deploy Config
#
# Deploy:   cd src/stock_pipeline/ingestion/massive_exchanges
#           sam build && sam deploy
#
# Local:    sam local invoke MassiveExchangesIngestFunction \
#             -e events/test_event.json \
#             --env-vars env.json
# ============================================================

[default.deploy.parameters]
stack_name        = "ingest-massive-exchanges"
resolve_s3        = true
s3_prefix         = "ingest-massive-exchanges"
confirm_changeset = true
capabilities      = "CAPABILITY_IAM"
disable_rollback  = true
parameter_overrides = "EnvironmentName=\"Development\" S3BucketName=\"graywolf--data--lake\" EnableSchedule=\"true\""
image_repositories = []

[default.global.parameters]
region = "us-east-1"
