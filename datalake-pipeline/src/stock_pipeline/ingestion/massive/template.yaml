AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Massive Ingestion Lambda.
  Fetches stock reference and market data from the Massive API
  and lands raw JSON payloads into the S3 Bronze layer.

# ============================================================
# GLOBAL SETTINGS
# ============================================================

Globals:
  Function:
    Runtime: python3.14
    Timeout: 300
    MemorySize: 256

    Environment:
      Variables:
        LOG_LEVEL: INFO

# ============================================================
# PARAMETERS
# ============================================================

Parameters:
  EnvironmentName:
    Type: String
    Default: Development
    AllowedValues:
      - Development

  S3BucketName:
    Type: String
    Default: graywolf--data--lake
    Description: S3 bucket used for the Bronze data lake

  ScheduleExpression:
    Type: String
    Default: "cron(0 14 ? * MON-FRI *)"
    Description: EventBridge schedule expression

  EnableSchedule:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  MassiveApiKey:
    Type: String
    NoEcho: true
    Description: Massive API key

# ============================================================
# CONDITIONS
# ============================================================

Conditions:
  IsScheduleEnabled: !Equals
    - !Ref EnableSchedule
    - "true"

# ============================================================
# RESOURCES
# ============================================================

Resources:
  # ----------------------------------------------------------
  # MASSIVE INGESTION LAMBDA
  # ----------------------------------------------------------

  MassiveIngestFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: ingest-massive

      Description: >
        Fetches stock reference and market data from Massive
        and stores the raw responses in the S3 Bronze layer.

      # Current Massive application folder
      CodeUri: .

      # app.py contains the single Lambda entry point
      Handler: app.lambda_handler

      Architectures:
        - x86_64

      Environment:
        Variables:
          MASSIVE_API_KEY: !Ref MassiveApiKey

          S3_BUCKET_NAME: !Ref S3BucketName

      # ------------------------------------------------------
      # IAM PERMISSIONS
      # ------------------------------------------------------

      Policies:
        - Statement:
            - Sid: S3BronzeWriteAccess

              Effect: Allow

              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket

              Resource:
                - !Sub "arn:aws:s3:::${S3BucketName}"

                - !Sub "arn:aws:s3:::${S3BucketName}/*"

      # ------------------------------------------------------
      # EVENTBRIDGE SCHEDULE
      # ------------------------------------------------------

      Events:
        ScheduledRun:
          Type: Schedule

          Properties:
            Schedule: !Ref ScheduleExpression

            Description: Scheduled Massive ingestion run

            Enabled: !If
              - IsScheduleEnabled
              - true
              - false

      # ------------------------------------------------------
      # TAGS
      # ------------------------------------------------------

      Tags:
        Project: StockPipeline-DataLake
        Environment: !Ref EnvironmentName
        Owner: Jimmy Patel
        ManagedBy: AWS SAM
        Layer: Ingestion
        Source: Massive

  # ----------------------------------------------------------
  # CLOUDWATCH LOG GROUP
  # ----------------------------------------------------------

  MassiveIngestLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:
      LogGroupName: !Sub "/aws/lambda/${MassiveIngestFunction}"

      RetentionInDays: 30

# ============================================================
# OUTPUTS
# ============================================================

Outputs:
  FunctionName:
    Description: Massive ingestion Lambda function name

    Value: !Ref MassiveIngestFunction

  FunctionArn:
    Description: Massive ingestion Lambda function ARN

    Value: !GetAtt MassiveIngestFunction.Arn

  LogGroupName:
    Description: Massive CloudWatch log group name

    Value: !Ref MassiveIngestLogGroup
