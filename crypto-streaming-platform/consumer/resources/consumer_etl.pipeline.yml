# The main pipeline for consumer

resources:
  pipelines:
    consumer_etl:
      name: consumer_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/consumer_etl"

      libraries:
        - glob:
            include: ../src/consumer_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
