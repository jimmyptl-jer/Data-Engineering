AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Finnhub Ingestion Lambda.
  Fetches stock ticker reference data from the Finnhub API
  and lands raw JSON payloads into the S3 Bronze layer.

# ============================================================
# GLOBAL SETTINGS
# ============================================================

Globals:
  Function:
    Runtime: python3.14
    Timeout: 300
    MemorySize: 256

    Environment:
      Variables:
        LOG_LEVEL: INFO

# ============================================================
# PARAMETERS
# ============================================================

Parameters:
  EnvironmentName:
    Type: String
    Default: Development
    AllowedValues:
      - Development

  S3BucketName:
    Type: String
    Default: graywolf--data--lake
    Description: S3 bucket used for the Bronze data lake

  Exchange:
    Type: String
    Default: US
    Description: Finnhub exchange code to ingest

  ScheduleExpression:
    Type: String
    Default: "cron(0 14 ? * MON-FRI *)"
    Description: EventBridge schedule expression

  EnableSchedule:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  FinnhubApiKey:
    Type: String
    NoEcho: true
    Description: Finnhub API key

# ============================================================
# CONDITIONS
# ============================================================

Conditions:
  IsScheduleEnabled: !Equals
    - !Ref EnableSchedule
    - "true"

# ============================================================
# RESOURCES
# ============================================================

Resources:
  # ----------------------------------------------------------
  # FINNHUB INGESTION LAMBDA
  # ----------------------------------------------------------

  FinnhubIngestFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: ingest-finnhub

      Description: >
        Fetches stock ticker reference data from Finnhub
        and stores the raw response in the S3 Bronze layer.

      # Project root
      CodeUri: .

      # Full Python package path
      Handler: app.lambda_handler

      Architectures:
        - x86_64

      Environment:
        Variables:
          FINNHUB_API_KEY: !Ref FinnhubApiKey

          S3_BUCKET_NAME: !Ref S3BucketName

          EXCHANGE: !Ref Exchange

      # ------------------------------------------------------
      # IAM PERMISSIONS
      # ------------------------------------------------------

      Policies:
        - Statement:
            - Sid: S3BronzeWriteAccess

              Effect: Allow

              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket

              Resource:
                - !Sub "arn:aws:s3:::${S3BucketName}"

                - !Sub "arn:aws:s3:::${S3BucketName}/*"

      # ------------------------------------------------------
      # EVENTBRIDGE SCHEDULE
      # ------------------------------------------------------

      Events:
        ScheduledRun:
          Type: Schedule

          Properties:
            Schedule: !Ref ScheduleExpression

            Description: Scheduled Finnhub ticker reference ingestion run

            Enabled: !If
              - IsScheduleEnabled
              - true
              - false

            Input: !Sub |
              {
                "exchange": "${Exchange}"
              }

      # ------------------------------------------------------
      # TAGS
      # ------------------------------------------------------

      Tags:
        Project: StockPipeline-DataLake
        Environment: !Ref EnvironmentName
        Owner: Jimmy Patel
        ManagedBy: AWS SAM
        Layer: Ingestion
        Source: Finnhub

  # ----------------------------------------------------------
  # CLOUDWATCH LOG GROUP
  # ----------------------------------------------------------

  FinnhubIngestLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:
      LogGroupName: !Sub "/aws/lambda/${FinnhubIngestFunction}"

      RetentionInDays: 30

# ============================================================
# OUTPUTS
# ============================================================

Outputs:
  FunctionName:
    Description: Finnhub ingestion Lambda function name

    Value: !Ref FinnhubIngestFunction

  FunctionArn:
    Description: Finnhub ingestion Lambda function ARN

    Value: !GetAtt FinnhubIngestFunction.Arn

  LogGroupName:
    Description: CloudWatch log group name

    Value: !Ref FinnhubIngestLogGroup
