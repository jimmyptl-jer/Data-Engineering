AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Massive Stock Overview Ingestion Lambda
  Fetches stock ticker details / company overview from the Massive (Polygon.io) API
  and lands raw JSON payloads into the S3 Bronze layer.

# ============================================================
# GLOBAL SETTINGS
# ============================================================

Globals:
  Function:
    Timeout: 300
    MemorySize: 256
    Runtime: python3.14
    Environment:
      Variables:
        LOG_LEVEL: INFO

# ============================================================
# PARAMETERS
# ============================================================

Parameters:
  EnvironmentName:
    Type: String
    Default: Development
    AllowedValues:
      - Development
      - QA
      - UAT
      - Production

  S3BucketName:
    Type: String
    Default: graywolf--data--lake
    Description: Target S3 data lake bucket (must already exist)

  StockSymbols:
    Type: String
    Default: "IBM"
    Description: Comma-separated stock symbols to fetch overview for

  ScheduleExpression:
    Type: String
    Default: "cron(0 14 ? * MON-FRI *)"
    Description: EventBridge schedule expression for automatic runs

  EnableSchedule:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  MassiveApiKey:
    Type: String
    NoEcho: true
    Description: Massive (Polygon.io) API key

# ============================================================
# CONDITIONS
# ============================================================

Conditions:
  IsScheduleEnabled: !Equals [!Ref EnableSchedule, "true"]

# ============================================================
# RESOURCES
# ============================================================

Resources:

  MassiveStockOverviewIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ingest-massive-stock-overview-${EnvironmentName}"
      Handler: src.stock_pipeline.ingestion.massive_stock_overview.app.lambda_handler
      # CodeUri points to the project root so the full src package is included
      CodeUri: ../../../../
      Description: Ingests Massive (Polygon.io) stock ticker details / company overview → S3 Bronze
      Architectures:
        - x86_64
      Tags:
        Project: AlphaVantage-DataLake
        Environment: !Ref EnvironmentName
        Owner: Jimmy Patel
        ManagedBy: AWS SAM
        Layer: Ingestion
        Source: Massive
      Environment:
        Variables:
          MASSIVE_API_KEY: !Ref MassiveApiKey
          S3_BUCKET_NAME: !Ref S3BucketName
      Policies:
        - Statement:
            - Sid: S3BronzeWriteAccess
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${S3BucketName}"
                - !Sub "arn:aws:s3:::${S3BucketName}/*"
      Events:
        ScheduledRun:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Scheduled Massive stock overview ingestion run
            Enabled: !If [IsScheduleEnabled, true, false]
            Input: !Sub '{"stock_symbols": ["${StockSymbols}"]}'

  MassiveStockOverviewIngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MassiveStockOverviewIngestFunction}"
      RetentionInDays: 30

# ============================================================
# OUTPUTS
# ============================================================

Outputs:
  FunctionName:
    Description: Massive stock overview ingestion Lambda function name
    Value: !Ref MassiveStockOverviewIngestFunction

  FunctionArn:
    Description: Massive stock overview ingestion Lambda function ARN
    Value: !GetAtt MassiveStockOverviewIngestFunction.Arn

  LogGroupName:
    Description: CloudWatch log group name
    Value: !Ref MassiveStockOverviewIngestLogGroup
