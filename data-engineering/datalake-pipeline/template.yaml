AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Alpha Vantage Data Lake Pipeline
  Bronze → Silver → Gold ETL pipeline with incremental processing

# ============================================================
# GLOBAL SETTINGS
# ============================================================

Globals:
  Function:
    Timeout: 900
    MemorySize: 3008
    Runtime: python3.14
    Environment:
      Variables:
        LOG_LEVEL: INFO

# ============================================================
# PARAMETERS
# ============================================================

Parameters:
  EnvironmentName:
    Type: String
    Default: Development
    AllowedValues:
      - Development
      - QA
      - UAT
      - Production

  S3BucketName:
    Type: String
    Default: graywolf-stock-data-bucket

  ScheduleExpression:
    Type: String
    Default: "cron(0 14 ? * MON-FRI *)"
    Description: When the end-to-end workflow (ingest → transform) runs

  StockSymbol:
    Type: String
    Default: "IBM"
    Description: Stock symbol passed to the ingestion Lambdas

  FinnhubExchange:
    Type: String
    Default: "US"
    Description: Exchange passed to the Finnhub ingestion Lambda

  AlphaVantageIngestFunctionName:
    Type: String
    Default: "ingest-alpha-vantage-Development"
    Description: Deployed by ingestion/alpha_vantage (ingest-alpha-vantage-<EnvironmentName>)

  MassiveIngestFunctionName:
    Type: String
    Default: "ingest-massive"
    Description: Deployed by ingestion/massive

  FinnhubIngestFunctionName:
    Type: String
    Default: "ingest-finnhub"
    Description: Deployed by ingestion/finnhub

  EnableSchedule:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"


# ============================================================
# CONDITIONS
# ============================================================

Conditions:
  IsScheduleEnabled: !Equals [!Ref EnableSchedule, "true"]

# ============================================================
# RESOURCES
# ============================================================

Resources:
  # ----------------------------------------------------------
  # SNS TOPIC — Alarm notifications
  # ----------------------------------------------------------

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "stock-pipeline-alerts-${EnvironmentName}"
      Tags:
        - Key: Project
          Value: AlphaVantage-DataLake
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: Jimmy Patel
        - Key: ManagedBy
          Value: AWS SAM

  # ----------------------------------------------------------
  # S3 DATA LAKE BUCKET
  # ----------------------------------------------------------

  DatalakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName

      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      Tags:
        - Key: Project
          Value: AlphaVantage-DataLake
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: Jimmy Patel
        - Key: ManagedBy
          Value: AWS SAM
        - Key: DataClassification
          Value: Internal

      LifecycleConfiguration:
        Rules:
          - Id: BronzeToSilverTransition
            Status: Enabled
            Prefix: stock/bronze
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 180
                StorageClass: GLACIER_IR
              - TransitionInDays: 365
                StorageClass: GLACIER
              - TransitionInDays: 2555
                StorageClass: DEEP_ARCHIVE

          - Id: SilverToGoldTransition
            Status: Enabled
            Prefix: stock/silver
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 180
                StorageClass: GLACIER_IR
              - TransitionInDays: 365
                StorageClass: GLACIER
              - TransitionInDays: 2555
                StorageClass: DEEP_ARCHIVE

  # ----------------------------------------------------------
  # LAMBDA FUNCTION
  # ----------------------------------------------------------

  StockPipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stock-data-pipeline-${EnvironmentName}"

      Handler: src.stock_pipeline.app.lambda_handler

      CodeUri: .

      Description: Alpha Vantage Data Lake Pipeline — Bronze → Silver → Gold ETL

      Architectures:
        - x86_64

      Tags:
        Project: AlphaVantage-DataLake
        Environment: !Ref EnvironmentName
        Owner: Jimmy Patel
        ManagedBy: AWS SAM
        DataClassification: Internal

      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref DatalakeBucket

      Policies:
        - Statement:
            - Sid: S3DataLakeAccess
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - !GetAtt DatalakeBucket.Arn
                - !Sub "${DatalakeBucket.Arn}/*"


  # ----------------------------------------------------------
  # END-TO-END WORKFLOW (Step Functions)
  #
  # 1. Generate one run_id for this execution.
  # 2. Run the three ingestion Lambdas in parallel (API → Bronze).
  #    The ingestion Lambdas report failure as statusCode 500 rather
  #    than raising, so each branch checks it and fails the workflow.
  # 3. Run the transform Lambda for that run_id (Bronze → Silver → Gold).
  # ----------------------------------------------------------

  StockPipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "stock-data-pipeline-${EnvironmentName}"
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref AlphaVantageIngestFunctionName
        - LambdaInvokePolicy:
            FunctionName: !Ref MassiveIngestFunctionName
        - LambdaInvokePolicy:
            FunctionName: !Ref FinnhubIngestFunctionName
        - LambdaInvokePolicy:
            FunctionName: !Ref StockPipelineFunction
      Events:
        ScheduledRun:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Scheduled end-to-end pipeline execution
            Enabled: !If [IsScheduleEnabled, true, false]
      Definition:
        Comment: Ingest all sources into Bronze, then build Silver and Gold
        StartAt: CreateRunId
        States:
          CreateRunId:
            Type: Pass
            Parameters:
              run_id.$: "States.Format('batch_{}', $$.Execution.Name)"
            Next: IngestToBronze
          IngestToBronze:
            Type: Parallel
            ResultPath: null
            Next: TransformBronzeToGold
            Branches:
              - StartAt: IngestAlphaVantage
                States:
                  IngestAlphaVantage:
                    Type: Task
                    Resource: arn:aws:states:::lambda:invoke
                    Parameters:
                      FunctionName: !Ref AlphaVantageIngestFunctionName
                      Payload:
                        run_id.$: $.run_id
                        stock_symbols:
                          - !Ref StockSymbol
                    Retry:
                      - ErrorEquals:
                          - Lambda.ServiceException
                          - Lambda.TooManyRequestsException
                          - Lambda.SdkClientException
                        IntervalSeconds: 5
                        MaxAttempts: 3
                        BackoffRate: 2
                    ResultSelector:
                      statusCode.$: $.Payload.statusCode
                    ResultPath: $.result
                    Next: CheckAlphaVantage
                  CheckAlphaVantage:
                    Type: Choice
                    Choices:
                      - Variable: $.result.statusCode
                        NumericEquals: 500
                        Next: AlphaVantageFailed
                    Default: AlphaVantageSucceeded
                  AlphaVantageFailed:
                    Type: Fail
                    Error: IngestionFailed
                    Cause: Alpha Vantage ingestion Lambda returned statusCode 500
                  AlphaVantageSucceeded:
                    Type: Succeed
              - StartAt: IngestMassive
                States:
                  IngestMassive:
                    Type: Task
                    Resource: arn:aws:states:::lambda:invoke
                    Parameters:
                      FunctionName: !Ref MassiveIngestFunctionName
                      Payload:
                        run_id.$: $.run_id
                        symbol: !Ref StockSymbol
                    Retry:
                      - ErrorEquals:
                          - Lambda.ServiceException
                          - Lambda.TooManyRequestsException
                          - Lambda.SdkClientException
                        IntervalSeconds: 5
                        MaxAttempts: 3
                        BackoffRate: 2
                    ResultSelector:
                      statusCode.$: $.Payload.statusCode
                    ResultPath: $.result
                    Next: CheckMassive
                  CheckMassive:
                    Type: Choice
                    Choices:
                      - Variable: $.result.statusCode
                        NumericEquals: 500
                        Next: MassiveFailed
                    Default: MassiveSucceeded
                  MassiveFailed:
                    Type: Fail
                    Error: IngestionFailed
                    Cause: Massive ingestion Lambda returned statusCode 500
                  MassiveSucceeded:
                    Type: Succeed
              - StartAt: IngestFinnhub
                States:
                  IngestFinnhub:
                    Type: Task
                    Resource: arn:aws:states:::lambda:invoke
                    Parameters:
                      FunctionName: !Ref FinnhubIngestFunctionName
                      Payload:
                        run_id.$: $.run_id
                        exchange: !Ref FinnhubExchange
                    Retry:
                      - ErrorEquals:
                          - Lambda.ServiceException
                          - Lambda.TooManyRequestsException
                          - Lambda.SdkClientException
                        IntervalSeconds: 5
                        MaxAttempts: 3
                        BackoffRate: 2
                    ResultSelector:
                      statusCode.$: $.Payload.statusCode
                    ResultPath: $.result
                    Next: CheckFinnhub
                  CheckFinnhub:
                    Type: Choice
                    Choices:
                      - Variable: $.result.statusCode
                        NumericEquals: 500
                        Next: FinnhubFailed
                    Default: FinnhubSucceeded
                  FinnhubFailed:
                    Type: Fail
                    Error: IngestionFailed
                    Cause: Finnhub ingestion Lambda returned statusCode 500
                  FinnhubSucceeded:
                    Type: Succeed
          TransformBronzeToGold:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !Ref StockPipelineFunction
              Payload:
                run_id.$: $.run_id
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.TooManyRequestsException
                  - Lambda.SdkClientException
                IntervalSeconds: 5
                MaxAttempts: 3
                BackoffRate: 2
            End: true

  # ----------------------------------------------------------
  # CLOUDWATCH LOG GROUP (Explicit — sets retention)
  # ----------------------------------------------------------

  StockPipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StockPipelineFunction}"
      RetentionInDays: 30

  # ----------------------------------------------------------
  # CLOUDWATCH ALARM — Lambda Errors
  # ----------------------------------------------------------

  StockPipelineErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "stock-pipeline-errors-${EnvironmentName}"
      AlarmDescription: Triggers when the stock pipeline Lambda function errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref StockPipelineFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: AlphaVantage-DataLake
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: Jimmy Patel
        - Key: ManagedBy
          Value: AWS SAM

  # ----------------------------------------------------------
  # CLOUDWATCH ALARM — Lambda Duration (close to timeout)
  # ----------------------------------------------------------

  StockPipelineDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "stock-pipeline-duration-warning-${EnvironmentName}"
      AlarmDescription: Triggers when pipeline execution exceeds 12 minutes (close to 15 min timeout)
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref StockPipelineFunction
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 720000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: AlphaVantage-DataLake
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: Jimmy Patel
        - Key: ManagedBy
          Value: AWS SAM

  # ----------------------------------------------------------
  # CLOUDWATCH ALARM — Workflow failures
  # ----------------------------------------------------------

  StockPipelineWorkflowFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "stock-pipeline-workflow-failed-${EnvironmentName}"
      AlarmDescription: Triggers when the end-to-end Step Functions workflow (ingest → transform) fails
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref StockPipelineStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: AlphaVantage-DataLake
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: Jimmy Patel
        - Key: ManagedBy
          Value: AWS SAM

# ============================================================
# OUTPUTS
# ============================================================

Outputs:
  StockPipelineFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt StockPipelineFunction.Arn

  StockPipelineFunctionName:
    Description: Lambda function name
    Value: !Ref StockPipelineFunction

  LogGroupName:
    Description: CloudWatch Log Group for pipeline logs
    Value: !Ref StockPipelineLogGroup

  DatalakeBucketName:
    Description: S3 data lake bucket name
    Value: !Ref DatalakeBucket

  StateMachineArn:
    Description: Step Functions workflow that runs ingestion then the transform
    Value: !Ref StockPipelineStateMachine

  AlertTopicArn:
    Description: SNS topic for pipeline alerts — subscribe your email/Slack webhook here
    Value: !Ref AlertTopic
