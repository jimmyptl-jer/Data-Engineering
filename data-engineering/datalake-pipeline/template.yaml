AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Alpha Vantage Data Lake Pipeline
  Bronze → Silver → Gold ETL pipeline with incremental processing

# ============================================================
# GLOBAL SETTINGS
# ============================================================

Globals:
  Function:
    Timeout: 900
    MemorySize: 3072
    Runtime: python3.9
    Environment:
      Variables:
        S3_BUCKET_NAME: !Ref S3BucketName
        LOG_LEVEL: INFO

# ============================================================
# PARAMETERS
# ============================================================

Parameters:
  EnvironmentName:
    Type: String
    Default: Development
    AllowedValues:
      - Development
      - QA
      - UAT
      - Production

  S3BucketName:
    Type: String
    Default: graywolf--data--lake

  AlphaVantageApiKey:
    Type: String
    NoEcho: true

  StockSymbols:
    Type: String
    Default: "IBM"

  ScheduleExpression:
    Type: String
    Default: "cron(0 14 ? * MON-FRI *)"

  EnableSchedule:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
# ============================================================
# CONDITIONS
# ============================================================

Conditions:
  IsScheduleEnabled: !Equals [!Ref EnableSchedule, "true"]

# ============================================================
# RESOURCES
# ============================================================

Resources:
  # ----------------------------------------------------------
  # LAMBDA FUNCTION
  # ----------------------------------------------------------

  StockPipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: stock-data-pipeline

      Handler: src.stock_pipeline.app.lambda_handler

      CodeUri: .

      Description: Alpha Vantage Data Lake Pipeline — Bronze → Silver → Gold ETL

      Architectures:
        - x86_64

      Tags:
        - Key: Project
          Value: AlphaVantage-DataLake

        - Key: Environment
          Value: Development

        - Key: Owner
          Value: Jimmy Patel

        - Key: ManagedBy
          Value: AWS SAM

        - Key: DataClassification
          Value: Internal

      Environment:
        Variables:
          ALPHA_VANTAGE_API_KEY: !Ref AlphaVantageApiKey
          ALPHA_VANTAGE_API_KEY_1: !Ref AlphaVantageApiKey1
          ALPHA_VANTAGE_API_KEY_2: !Ref AlphaVantageApiKey2
          ALPHA_VANTAGE_API_KEY_3: !Ref AlphaVantageApiKey3
          ALPHA_VANTAGE_API_KEY_4: !Ref AlphaVantageApiKey4
          ALPHA_VANTAGE_API_KEY_5: !Ref AlphaVantageApiKey5
          ALPHA_VANTAGE_API_KEY_6: !Ref AlphaVantageApiKey6
          ALPHA_VANTAGE_API_KEY_7: !Ref AlphaVantageApiKey7
          ALPHA_VANTAGE_API_KEY_8: !Ref AlphaVantageApiKey8
          ALPHA_VANTAGE_API_KEY_9: !Ref AlphaVantageApiKey9
          ALPHA_VANTAGE_API_KEY_10: !Ref AlphaVantageApiKey10
          ALPHA_VANTAGE_API_KEY_11: !Ref AlphaVantageApiKey11
          ALPHA_VANTAGE_API_KEY_12: !Ref AlphaVantageApiKey12
          ALPHA_VANTAGE_API_KEY_13: !Ref AlphaVantageApiKey13
          ALPHA_VANTAGE_API_KEY_14: !Ref AlphaVantageApiKey14
          ALPHA_VANTAGE_API_KEY_15: !Ref AlphaVantageApiKey15

          S3_BUCKET_NAME: !Ref S3BucketName

      Policies:
        - Statement:
            - Sid: S3DataLakeAccess
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${S3BucketName}"
                - !Sub "arn:aws:s3:::${S3BucketName}/*"
      Events:
        ScheduledRun:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Scheduled ETL pipeline execution
            Enabled: !If [IsScheduleEnabled, true, false]
            Input: !Sub '{"stock_symbols": ["${StockSymbols}"]}'

  DatalakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName

      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      Tags:
        - Key: Project
          Value: AlphaVantage-DataLake

        - Key: Environment
          Value: Development

        - Key: Owner
          Value: Jimmy Patel

        - Key: ManagedBy
          Value: AWS SAM

        - Key: DataClassification
          Value: Internal

      LifecycleConfiguration:
        Rules:
          - Id: BronzeToSilverTransition
            Status: Enabled
            Prefix: stock/bronze
             Transitions:

                - TransitionInDays: 30
                  StorageClass: STANDARD_IA

                - TransitionInDays: 180
                  StorageClass: GLACIER_IR

                - TransitionInDays: 365
                  StorageClass: GLACIER

                - TransitionInDays: 2555
                  StorageClass: DEEP_ARCHIVE
          
          - Id: SilverToGoldTransition
            Status: Enabled
            Prefix: stock/silver
             Transitions:

                - TransitionInDays: 30
                  StorageClass: STANDARD_IA

                - TransitionInDays: 180
                  StorageClass: GLACIER_IR

                - TransitionInDays: 365
                  StorageClass: GLACIER

                - TransitionInDays: 2555
                  StorageClass: DEEP_ARCHIVE

  # ----------------------------------------------------------
  # CLOUDWATCH LOG GROUP (Explicit — sets retention)
  # ----------------------------------------------------------

  StockPipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StockPipelineFunction}"
      RetentionInDays: 30

  # ----------------------------------------------------------
  # CLOUDWATCH ALARM — Lambda Errors
  # ----------------------------------------------------------

  StockPipelineErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: stock-pipeline-errors
      AlarmDescription: Triggers when the stock pipeline Lambda function errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref StockPipelineFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: AlphaVantage-DataLake

        - Key: Environment
          Value: Development

        - Key: Owner
          Value: Jimmy Patel

        - Key: ManagedBy
          Value: AWS SAM

        - Key: DataClassification
          Value: Internal

  # ----------------------------------------------------------
  # CLOUDWATCH ALARM — Lambda Duration (close to timeout)
  # ----------------------------------------------------------

  StockPipelineDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: stock-pipeline-duration-warning
      AlarmDescription: Triggers when pipeline execution exceeds 12 minutes (close to 15 min timeout)
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref StockPipelineFunction
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 720000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: AlphaVantage-DataLake

        - Key: Environment
          Value: Development

        - Key: Owner
          Value: Jimmy Patel

        - Key: ManagedBy
          Value: AWS SAM

        - Key: DataClassification
          Value: Internal

# ============================================================
# OUTPUTS
# ============================================================

Outputs:
  StockPipelineFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt StockPipelineFunction.Arn

  StockPipelineFunctionName:
    Description: Lambda function name
    Value: !Ref StockPipelineFunction

  LogGroupName:
    Description: CloudWatch Log Group for pipeline logs
    Value: !Ref StockPipelineLogGroup
