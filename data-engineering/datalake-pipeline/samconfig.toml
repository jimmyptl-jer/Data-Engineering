version = 0.1

[default.deploy.parameters]
stack_name = "stock-pipeline"
resolve_s3 = true
s3_prefix = "stock-pipeline"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
disable_rollback = true
parameter_overrides = "EnvironmentName=\"Development\" S3BucketName=\"graywolf--data--lake\" StockSymbols=\"IBM\" ScheduleExpression=\"cron(0 14 ? * MON-FRI *)\" EnableSchedule=\"true\""
image_repositories = []

[default.global.parameters]
region = "us-east-1"
